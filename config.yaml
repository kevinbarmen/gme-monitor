# GME-монитор — все настройки здесь. Ключи/токены — только в .env.
# Новый источник того же типа = одна запись в соответствующем списке ниже.

paths:
  db: data/gme.db               # отдельная SQLite-база этого проекта
  logs: data/logs
  beacon: ~/status/gme.ts        # маячок для heartbeat.py
  lock: data/run.lock

http:
  user_agent: "gme-monitor/0.1 (personal info monitor; python-requests)"
  min_interval_sec: 2.0          # пауза между запросами к одному хосту (Reddit требует >=2)
  timeout_sec: 20
  hosts:                         # переопределения по хостам
    www.reddit.com:
      min_interval_sec: 7        # RSS/JSON без авторизации: ~1 запрос в несколько секунд
    oauth.reddit.com:
      min_interval_sec: 2
    www.sec.gov:                 # архив филингов (Form 4 XML); лимит SEC — 10 запросов/с
      min_interval_sec: 0.3
    query1.finance.yahoo.com:    # Yahoo отвечает 429 на не-браузерный UA
      user_agent: &browser "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36"
    feeds.finance.yahoo.com:
      user_agent: *browser

telegram:
  # токен и chat_id берутся из .env: GME_TG_BOT_TOKEN, GME_TG_CHAT_ID
  dry_run_if_no_token: true      # без токена сообщения печатаются в консоль

# ---------------- Источники ----------------

reddit:
  # режим выбирается сам: OAuth (если REDDIT_CLIENT_ID/SECRET в .env) → публичный JSON → RSS.
  # В RSS нет апвотов: вместо min_upvotes берутся первые rss_top_n постов каждого эндпоинта,
  # алерт по апвот-темпу не работает. Для полноценной работы нужен OAuth (см. README).
  endpoints: [top_day, hot]      # top за сутки и hot
  limit: 50
  rss_top_n: 10
  subreddits:
    - name: Superstonk
      bias: бычий сабреддит
      min_upvotes: 200
      velocity_ups_per_hour: 800   # порог «аномального» апвот-темпа для алерта
    - name: GME
      bias: бычий сабреддит
      min_upvotes: 50
      velocity_ups_per_hour: 300
    - name: DeepFuckingValue
      bias: бычий сабреддит
      min_upvotes: 50
      velocity_ups_per_hour: 300
    - name: stocks               # нейтральный — обязателен, не удалять
      bias: нейтральный
      min_upvotes: 50
      velocity_ups_per_hour: 300
      search: "GME OR GameStop"   # общий саб — берём только посты по ключевым словам
  # флеары мемов/шитпостов (сравнение без учёта регистра, по вхождению)
  excluded_flairs:
    - meme
    - shitpost
    - "🤡"
    - "🦍 buckle up"
    - humor
    - "fun"
    - "art"
    - "cool"
  # закреплённые/служебные посты по заголовку (в RSS нет флага stickied)
  excluded_title_patterns:
    - daily directory
    - daily discussion
    - weekly discussion
    - what are your moves
  # домены, которые считаются «медиа без ссылки» (мемы-картинки/видео)
  media_domains: [i.redd.it, v.redd.it, i.imgur.com, imgur.com, reddit.com/gallery]
  r_all:                         # пост GME-саба в топе r/all = аномальное внимание
    enabled: true                # работает и в RSS-режиме (1 запрос за сбор)
    limit: 100
    alert_top_n: 100             # алерт, если пост на месте <= N
    max_post_age_hours: 24
  velocity:                      # точный апвот-темп — только в OAuth/JSON-режиме
    max_post_age_hours: 8        # темп считаем только для свежих постов
    min_upvotes: 300             # и только когда пост уже заметный

news:
  feeds:
    - name: Google News
      url: "https://news.google.com/rss/search?q=GameStop+OR+GME&hl=en-US&gl=US&ceid=US:en"
      bias: нейтральный
    - name: Yahoo Finance
      url: "https://feeds.finance.yahoo.com/rss/2.0/headline?s=GME&region=US&lang=en-US"
      bias: нейтральный
  title_similarity: 0.82         # порог схожести заголовков для дедупликации
  dedup_window_days: 3
  max_age_hours: 36              # старые новости из фида не берём
  stop_words:                    # кликбейт / мусорные статьи (без учёта регистра)
    - "price target"
    - "stocks to buy"
    - "stocks to sell"
    - "should you buy"
    - "is it time to buy"
    - "better buy"
    - "millionaire"
    - "could make you"
    - "top stock"
    - "meme stocks to watch"
    - "prediction:"
    - "trending stock"
    - "stock forecast"
    - "why is gamestop stock"

sec:
  cik: "0001326380"              # GameStop Corp.
  # SEC требует User-Agent с контактом — задаётся в .env: SEC_USER_AGENT
  forms:                         # эти филинги всегда идут в дайджест
    - 8-K
    - 8-K/A
    - 10-Q
    - 10-K
    - 10-K/A
    - "4"
    - SC 13D
    - SC 13D/A
    - SC 13G
    - SC 13G/A
    - SCHEDULE 13D
    - SCHEDULE 13D/A
    - SCHEDULE 13G
    - SCHEDULE 13G/A
  alert_forms:                   # эти — ещё и срочным алертом
    - 8-K
    - SC 13D
    - SC 13D/A
    - SCHEDULE 13D
    - SCHEDULE 13D/A
    - SC 13G
    - SCHEDULE 13G
  first_run_lookback_days: 3     # при первом запуске старые филинги не алертим

price:
  ticker: GME
  alert_move_pct: 15             # ±% за день для срочного алерта

# ---------------- Фильтр / скоринг / дайджест ----------------

scoring:
  model: claude-sonnet-5-5
  effort: medium
  max_tokens: 16000
  use_fallbacks: true            # серверный fallback при отказе модели
  max_items_per_batch: 60
  text_chars_per_item: 1500      # обрезка текста поста для экономии токенов
  min_score: 5                   # ниже — не попадает в дайджест
  lookback_hours: 36
  prompt_file: prompts/scorer.md # промпт — только в prompts/, менять коммитом (см. CLAUDE.md)
  summary_max_chars: 600         # саммари длиннее — ответ невалиден

# ---------------- Контекст «что это значит» (только факты с источником) ----------------

fundamentals:                    # последние значения из отчётности (SEC XBRL company facts)
  max_age_days: 400              # значение старше — считается устаревшим и в контекст не идёт
  metrics:                       # kind: instant — на дату; quarter — за квартал; period — за любой период
    - key: cash
      label: денежные средства и эквиваленты
      kind: instant
      concepts: ["us-gaap:CashAndCashEquivalentsAtCarryingValue"]
    - key: marketable_securities
      label: рыночные ценные бумаги (краткосрочные)
      kind: instant
      concepts: ["us-gaap:MarketableSecuritiesCurrent"]
    - key: revenue_q
      label: выручка за квартал
      kind: quarter
      concepts: ["us-gaap:Revenues", "us-gaap:RevenueFromContractWithCustomerExcludingAssessedTax"]
    - key: net_income_q
      label: чистая прибыль за квартал
      kind: quarter
      concepts: ["us-gaap:NetIncomeLoss"]
    - key: debt
      label: долг
      kind: instant
      concepts: ["us-gaap:ConvertibleDebt", "us-gaap:LongTermDebt"]
    - key: equity
      label: собственный капитал
      kind: instant
      concepts: ["us-gaap:StockholdersEquity"]
    - key: shares_outstanding
      label: акций в обращении
      kind: instant
      unit: shares
      concepts: ["dei:EntityCommonStockSharesOutstanding", "us-gaap:CommonStockSharesOutstanding"]
    - key: buybacks
      label: выкуп собственных акций (байбек)
      kind: period
      concepts: ["us-gaap:PaymentsForRepurchaseOfCommonStock"]

context:
  enabled: true
  min_score: 7                   # контекст строится только для материалов с оценкой не ниже
  max_items: 5
  effort: medium
  max_tokens: 8000
  prompt_file: prompts/context.md
  text_chars_per_item: 3000
  argument_max_chars: 500
  scale_usd_vs: [revenue_q, cash]        # с чем соотносить сумму в долларах
  scale_shares_vs: [shares_outstanding]  # с чем соотносить число акций
  neutral_window_days: 7         # материалы нейтральных источников за столько дней — опора для аргументов
  neutral_max_items: 12
  filings_window_days: 30        # свежие SEC-филинги — тоже опора
  # формулировки, которых в выводе быть не может (регулярные выражения, без учёта регистра)
  banned_patterns:
    - "(стоит|следует|нужно|надо|пора|рекомендуе\\w*|советуе\\w*)\\s+(по|до)?(купать|купить|продавать|продать|держать)"
    - "целев\\w+\\s+цен\\w+"
    - "price\\s+target"
    - "прогноз\\w*\\s+(цен|курс)\\w*"
    - "(buy|sell|hold)\\s+rating"
    - "(вырастет|упад[её]т|взлетит|обвалится)\\s+(до|на)\\s+\\$?\\d"

analogs:                         # исторические аналоги: как цена вела себя после событий того же типа
  enabled: true
  since: "2023-01-01"            # события раньше в статистику не берутся (эпоха squeeze искажает разброс)
  horizons: [1, 5, 20]           # через сколько торговых дней хранить цену закрытия
  digest_horizon: 5              # какой горизонт показывать в дайджесте
  min_n: 5                       # меньше случаев — «недостаточно данных», без процентов
  form4_fetch_per_cycle: 40      # сколько Form 4 разбирать за один цикл сбора
  event_types:                   # фиксированный список типов: ключ → подпись
    earnings: отчётность (8-K с результатами)
    periodic_report: квартальный/годовой отчёт (10-Q/10-K)
    management_change: изменения в руководстве
    capital_raise: привлечение капитала или долга
    mna: сделка слияния/поглощения
    material_agreement: существенный договор
    shareholder_vote: итоги собрания акционеров
    insider_buy: покупка инсайдера на рынке (Form 4)
    insider_sell: продажа инсайдера на рынке (Form 4)
    insider_other: операция инсайдера без сделки на рынке
    major_holder: изменение доли крупного акционера (13D/G)
    buyback: выкуп собственных акций
    business: операционные новости бизнеса
    press: крупная пресса или интервью руководства
    other: прочее
  no_stats_types: [insider_other, other]   # по этим типам аналоги не показываются
  sec_8k_items:                  # item 8-K → тип события; порядок = приоритет
    "2.02": earnings
    "5.02": management_change
    "3.02": capital_raise
    "2.03": capital_raise
    "2.01": mna
    "1.01": material_agreement
    "5.07": shareholder_vote
  major_holder_forms: [SC 13D, SC 13D/A, SC 13G]

weekly:                          # воскресная сводка — одно сообщение вместо дайджеста
  enabled: true
  weekday: 6                     # 6 = воскресенье
  time: "09:50"                  # если отличается от digest.time — нужен отдельный запуск (см. print-cron)
  prompt_file: prompts/weekly.md
  effort: medium
  max_tokens: 8000
  top_items: 12                  # сколько лучших материалов недели передавать модели
  history_weeks: 3               # сколько прошлых недель смотреть в поиске «продолжений»
  text_max_chars: 400            # лимит длины одного пункта сводки

calendar:                        # ближайшие события для воскресной сводки
  horizon_days: 60
  manual:                        # подтверждённые даты вносятся вручную: {date, title, source}
    - date: "2026-10-30"
      title: истечение публичных варрантов GameStop (17:00 по Нью-Йорку)
      source: "сообщение компании, по материалам дайджеста"
  estimates:                     # ориентиры по датам прошлого года (не подтверждённые даты)
    - event_type: earnings
      title: квартальная отчётность
    - event_type: shareholder_vote
      title: годовое собрание акционеров

impact_eval:                     # оценка важности vs реальное движение цены (ранговая корреляция)
  enabled: true
  weekday: 6                     # день недели отчёта (6 = воскресенье, вместе с недельной сводкой)
  horizons: [1, 5]               # торговых дней после события
  min_n: 10                      # меньше дней-наблюдений — «недостаточно данных», без числа
  warn_rho: 0.1                  # корреляция не выше этого значения считается «около нуля»
  warn_weeks: 4                  # столько недель подряд — предупреждение «чинить промпт»

budget:
  max_tokens_per_day: 150000     # вход+выход за сутки (дайджест + evals); превышение → скоринг до завтра стоп
  cycle_timeout_sec: 1800        # максимум на один цикл сбора; дальше источники не ждём
  request_timeout_sec: 300       # таймаут одного запроса к Claude
  pricing_usd_per_mtok:          # [вход, выход] $ за 1 млн токенов — для оценки стоимости
    claude-sonnet-5-5: [2, 10]
    claude-opus-5-5: [4, 20]
    claude-haiku-4-5: [1, 5]
  weekly_cost_weekday: 6         # день недели строки «расходы за 7 дней» (6 = воскресенье, в недельной сводке)

evals:
  target_accuracy: 0.8           # цель совпадения с ручной разметкой

digest:
  time: "09:50"                  # локальное время (print-cron); после сбора в 09:23, мимо CS2 Heartbeat 09:30
  top_n: 5

# ---------------- Здоровье источников ----------------

health:
  retry_delays_sec: [30, 120, 600]  # повторы упавших источников: 30с → 2мин → 10мин → «недоступен»
  source_down_alert_hours: 24    # источник падает дольше — сообщение в TG

# ---------------- Расписание (для команды print-cron) ----------------

schedule:
  # CS2 занимает :00 по чётным часам (full), :32 (top), :11/:41 (health), каждые 5 мин (hot)
  collect_minute: 23             # сбор в нечётные часы в HH:23 (~8 мин, заканчивается до :32)
  collect_start_hour: 1
  collect_every_hours: 2
  heartbeat_time: "10:07"
